[package]
name = "requestx-api"
version = "1.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rocket = { version = "0.5.0-rc.4", features = ["json", "serde_json"] }
chrono = "0.4.22"
regex = "1.4.5"
dash-rs = {git = "https://github.com/zRyder/dash-rs.git", branch = "develop-stable"}
reqwest = { version = "0.12.4", features = ["json"] }
async-trait = "0.1.74"
sea-orm = { version = "1.2.0-rc.1", features = [ "sqlx-mysql", "runtime-async-std-native-tls", "macros", "mock" ] }
config = "0.14.0"
serde = { version = "1.0.192", features = ["derive"] }
toml = "0.8.19"
serde_derive = "1.0.192"
log4rs = { version = "1.2.0", features = ["rolling_file_appender", "console_appender", "compound_policy", "delete_roller"] }
jsonwebtoken = "9.2.0"
handlebars = "5.0.0"
tokio = {version = "1.43.0",  features = ["rt-multi-thread"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
bs58 = "0.5.1"

[dev-dependencies]
tokio-test = "0.4.3"
mockall = "0.12.1"